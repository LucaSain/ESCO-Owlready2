# Coolify deployment for the ESCO reasoner backend.
#
# Deploy this as a "Docker Compose" resource in Coolify. The compose file is
# the single source of truth -- set the variables below in Coolify's
# environment tab, not by editing this file.

services:
  backend:
    image: ghcr.io/lucasain/esco-owlready2-backend:latest
    pull_policy: always
    restart: unless-stopped

    environment:
      # Coolify replaces this with the generated domain and points its proxy
      # at container port 8000. Assign a domain in the UI, or let it use the
      # wildcard. Nothing else is needed to expose the service.
      - SERVICE_FQDN_BACKEND_8000

      # REQUIRED. The `:?` form makes Coolify refuse to deploy when it is
      # unset, rather than starting a backend that silently blocks every
      # browser request with a CORS error that looks like a frontend bug.
      # Comma-separated, no spaces, scheme included:
      #   https://esco.pages.dev,https://yourdomain.com
      - CORS_ORIGINS=${CORS_ORIGINS:?set this to your Cloudflare Pages origin}

      # Optional: also allow Cloudflare Pages *preview* deploys, whose
      # hostnames are per-commit and cannot be enumerated. Escape the dots --
      # an unescaped "." matches any character, so evil-esco.pages.dev would
      # pass. Leave unset if only production should reach the API.
      #   https://.*\.esco\.pages\.dev
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-}

      # Where the quadstore is mounted. Matches the volume below; change
      # both together or not at all.
      - ESCO_STORE=/data/esco.sqlite3

      # First boot on an empty volume fetches and decompresses the store from
      # here (~400 MB, about a minute). Every later boot finds the file and
      # skips it, so this costs once per volume, not once per deploy. Unset
      # it only if you provision the volume by hand.
      - ESCO_STORE_URL=${ESCO_STORE_URL:-https://github.com/LucaSain/ESCO-Owlready2/releases/download/esco-data-v1/esco.sqlite3.zst}

      # How many of an occupation's essential skills the candidate must hold
      # before the reasoner classifies them into it. Default 2.
      #
      # This is also a PERFORMANCE control, not just a precision one.
      # Measured on a 6-skill optics/photonics profile:
      #     min_skills=3  ->  117.4s, 4 occupations
      #     min_skills=2  ->    2.9s, 8 occupations
      # Proving "at least 3 distinct fillers" over nominals forces far more
      # tableau branching than "at least 2". Raise this only if you are ready
      # for requests that can take minutes.
      - MIN_SKILLS=${MIN_SKILLS:-2}

      # Occupations handed to the reasoner. Cost grows steeply: 20 -> ~3.5s,
      # 40 -> 192s, 80 -> did not finish. /match caps the per-request
      # override at 40 for that reason.
      - SHORTLIST=${SHORTLIST:-20}

      # HermiT's max heap. Must stay comfortably below the memory limit
      # further down, or the kernel kills the JVM mid-request and the
      # response is a 500 with nothing useful in the logs.
      - JAVA_MEMORY_MB=${JAVA_MEMORY_MB:-2048}

    volumes:
      # The 1.2 GB ESCO quadstore. It is NOT in the image -- the image is
      # 574 MB of code and a JRE. See "POPULATING THE VOLUME" below.
      #
      # Deliberately NOT :ro. esco_store.py already opens sqlite with
      # mode=ro, so nothing can write through the app anyway, and a
      # read-only mount would block the docker cp needed to populate the
      # volume in the first place. Several replicas can still share it.
      - esco-data:/data

    healthcheck:
      # start_period covers the WORST case: a first boot that downloads 400 MB
      # and decompresses it to 1.2 GB before uvicorn ever listens. A tighter
      # window makes Coolify kill and restart a container that is provisioning
      # correctly -- which then restarts the download, forever.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3

    deploy:
      resources:
        limits:
          # Python + the skill index sits around 80 MB idle; the rest is
          # headroom for the JVM. Keep this above JAVA_MEMORY_MB plus ~1 GB.
          memory: 3G

volumes:
  esco-data:

# ---------------------------------------------------------------------------
# THE VOLUME PROVISIONS ITSELF
# ---------------------------------------------------------------------------
# Nothing to do: the entrypoint downloads the store on first boot. Expect
# ~1 minute of "entrypoint: quadstore missing, fetching ..." in the logs,
# once, then "entrypoint: quadstore present" on every restart after.
#
# The manual routes below are only needed if you would rather not depend on
# the release asset, or are running somewhere without outbound internet.
#
# From a machine that already has the built store, with the stack running:
#
#   docker cp esco.sqlite3 <container>:/data/esco.sqlite3
#
# Or populate it without the stack running at all:
#
#   docker run --rm -v esco-data:/data -v "$PWD":/src alpine \
#     cp /src/esco.sqlite3 /data/esco.sqlite3
#
# To build it on the server instead, from esco.rdf (1.1 GB):
#
#   docker run --rm -v esco-data:/data -v "$PWD":/src \
#     -e ESCO_RDF=/src/esco.rdf -e ESCO_STORE=/data/esco.sqlite3 \
#     ghcr.io/lucasain/esco-owlready2-backend:latest python ingest.py
#
# ---------------------------------------------------------------------------
# ALSO
# ---------------------------------------------------------------------------
# - The GHCR package is private by default. Coolify pulling without
#   credentials gets "denied", which reads like the image does not exist.
#   Make the package public, or add a registry credential in Coolify.
# - Pushing a new `latest` does not redeploy anything by itself. Point the
#   publish workflow at Coolify's deploy webhook, or turn on its polling.
# - /match takes seconds by design -- it runs a DL reasoner. If you put a
#   proxy timeout in front of this, keep it above ~30s.
