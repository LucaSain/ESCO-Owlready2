[pytest]
# Backend is not a package (no __init__.py, flat modules like esco_store.py,
# main.py); this puts it on sys.path so `import main` etc. work regardless of
# where pytest is invoked from. Same effect as the sys.path insert in
# tests/conftest.py, kept here too since it's the more discoverable place to
# look when import errors happen.
pythonpath = .
testpaths = tests

markers =
    slow: exercises the real HermiT OWL/DL reasoner (via /match, reasoning.recommend,
          reasoning.build_tbox or reasoning.infer). Each such test spawns a Java
          subprocess and takes on the order of several seconds. Excluded from the
          default run by addopts below.

# Practical default: `pytest` alone runs only the fast suite (should finish in
# a few seconds). To run the slow/reasoner suite:      pytest -m slow
# To run everything, overriding this default:          pytest -m ""
# (an explicit -m on the command line replaces this one; it does not combine).
addopts = -m "not slow"

filterwarnings =
    # Not our bug to fix: starlette's own TestClient shim nags about httpx2 on
    # every import (it's a UserWarning subclass, not DeprecationWarning).
    # Silence it so real warnings from the app aren't buried.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
